<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cyber Threat Map 2D - FIXED</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; color: #00ff88; font-family: 'Orbitron', sans-serif; overflow: hidden; }
canvas { display: block; }
.header { position: absolute; top: 0; width: 100%; z-index: 100; background: rgba(0,0,0,0.9); padding: 20px; border-bottom: 2px solid #00ff88; text-align: center; font-size: 26px; font-weight: 900; text-shadow: 0 0 20px #00ff88; }
#cinemaBtn { position:absolute; top:80px; left:50%; transform:translateX(-50%); z-index:100; padding:12px 30px; background:#ff0088; border:none; border-radius:25px; color:#fff; font-family:'Orbitron'; font-weight:700; cursor:pointer; box-shadow:0 0 20px #ff0088; }
.stats { position: absolute; bottom: 30px; left: 30px; z-index: 100; background: rgba(0,0,0,0.9); border: 1px solid #00ff88; padding: 25px; border-radius: 15px; }
.log { position: absolute; bottom: 30px; right: 30px; z-index: 100; background: rgba(0,0,0,0.9); border: 1px solid #ff0088; padding: 20px; border-radius: 15px; width: 350px; height: 300px; overflow-y: auto; }
</style>
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<div class="header">🌐 LIVE CYBER ATTACK MAP 2D ● FIXED</div>
<button id="cinemaBtn">🎬 CINEMATIC MODE</button>
<div class="stats"><h3>STATS</h3><div>Attacks: <span id="attacks">0</span></div></div>
<div class="log"><h3>LOG</h3><div id="logList"></div></div>
<audio id="alertSound" src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3" preload="auto"></audio>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
const camera = new THREE.OrthographicCamera(-2, 2, 1, -1, 0.1, 1000);
camera.position.z = 3;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);
new OrbitControls(camera, renderer.domElement);

// الخريطة
const loader = new THREE.TextureLoader();
const map = new THREE.Mesh(
    new THREE.PlaneGeometry(4, 2),
    new THREE.MeshBasicMaterial({ map: loader.load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg') })
);
scene.add(map);

// احداثيات
const countryCoords = {
    "US": [-0.8, 0.3], "RU": [0.8, 0.5], "CN": [0.6, 0.2],
    "DE": [0.05, 0.35], "IN": [0.5, 0], "BR": [-0.3, -0.3],
    "EG": [0.15, 0.1], "JP": [1, 0.2], "GB": [-0.1, 0.4]
};

let attackCount = 0;
const attackLines = [];
let cinematicMode = false;
document.getElementById('cinemaBtn').onclick = () => {
    cinematicMode =!cinematicMode;
    document.getElementById('cinemaBtn').innerText = cinematicMode? '⚡ NORMAL MODE' : '🎬 CINEMATIC MODE';
}

// دالة تجيب داتا وهمية لو الAPI فشل
function getFakeData() {
    const countries = Object.keys(countryCoords);
    return Array(3).fill(0).map(() => ({
        ipAddress: `${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}`,
        countryCode: countries[Math.floor(Math.random()*countries.length)]
    }));
}

async function fetchAttacks() {
    let data = [];
    try {
        const res = await fetch('/api/attacks');
        data = await res.json();
        if(data.length === 0) throw new Error("empty");
    } catch(e) {
        console.log("Using fake data");
        data = getFakeData(); // مهم: لو مفيش داتا نجيب وهمي
    }

    data.forEach(ip => {
        const [endX, endY] = countryCoords[ip.countryCode] || [0,0];
        const startX = Math.random() * 4 - 2;
        const startY = Math.random() * 2 - 1;

        // نرسم قوس واضح
        const points = [];
        for(let i = 0; i <= 50; i++) {
            const t = i / 50;
            const x = startX + (endX - startX) * t;
            const y = startY + (endY - startY) * t + Math.sin(t * Math.PI) * 0.4;
            points.push(new THREE.Vector3(x, y, 0.01));
        }

        const material = new THREE.LineBasicMaterial({
            color: 0xff0088,
            transparent: true,
            opacity: 1 // نبدأ ب 1
        });
        const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), material);
        scene.add(line);
        attackLines.push({line, life: cinematicMode? 200 : 100}); // عمر اطول

        // نبضة حمرا
        const pulse = new THREE.Mesh(new THREE.CircleGeometry(0.05, 16), new THREE.MeshBasicMaterial({color: 0xff0000}));
        pulse.position.set(endX, endY, 0.02);
        scene.add(pulse);
        setTimeout(()=>scene.remove(pulse), 500);

        attackCount++;
        document.getElementById('attacks').innerText = attackCount;
        document.getElementById('logList').innerHTML = `<div>${ip.ipAddress} → ${ip.countryCode}</div>` + document.getElementById('logList').innerHTML;
    });
}

function animate() {
    requestAnimationFrame(animate);
    for(let i = attackLines.length - 1; i >= 0; i--) {
        attackLines[i].life--;
        attackLines[i].line.material.opacity = attackLines[i].life / (cinematicMode? 200 : 100);
        if(attackLines[i].life <= 0) {
            scene.remove(attackLines[i].line);
            attackLines.splice(i, 1);
        }
    }
    renderer.render(scene, camera);
}
animate();
setInterval(fetchAttacks, 2000); // كل 2 ثانية هجوم
</script>
</body>
</html>
