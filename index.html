<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cyber Threat Map LIVE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; color: #00ff88; font-family: 'Orbitron', sans-serif; overflow: hidden; }
canvas { display: block; }
.header { position: absolute; top: 0; width: 100%; z-index: 100; background: rgba(0,0,0,0.9); padding: 20px; border-bottom: 2px solid #00ff88; text-align: center; font-size: 26px; font-weight: 900; text-shadow: 0 0 20px #00ff88; }
.stats { position: absolute; bottom: 30px; left: 30px; z-index: 100; background: rgba(0,0,0,0.9); border: 1px solid #00ff88; padding: 25px; border-radius: 15px; min-width: 280px; }
.log { position: absolute; bottom: 30px; right: 30px; z-index: 100; background: rgba(0,0,0,0.9); border: 1px solid #ff0088; padding: 20px; border-radius: 15px; width: 350px; height: 300px; overflow-y: auto; }
.log-item { font-size: 12px; margin: 5px 0; color: #ccc; border-left: 2px solid #ff0088; padding-left: 8px; }
</style>
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<div class="header">🌐 LIVE CYBER ATTACK MAP ● VERCEL</div>
<div class="stats"><h3>GLOBAL STATISTICS</h3><div>Total Attacks: <span id="attacks">0</span></div></div>
<div class="log"><h3>🚨 LIVE ATTACK LOG</h3><div id="logList"></div></div>
<audio id="alertSound" src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3" preload="auto"></audio>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 0, 3);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.autoRotate = true;

const globe = new THREE.Mesh(new THREE.SphereGeometry(1, 64, 64), new THREE.MeshPhongMaterial({map: new THREE.TextureLoader().load('https://unpkg.com/three-globe/example/img/earth-night.jpg')}));
scene.add(globe);
scene.add(new THREE.AmbientLight(0x404040));
scene.add(new THREE.DirectionalLight(0xffffff, 1).position.set(5,3,5));

const countryCoords = {"US": [37.09, -95.71], "RU": [61.52, 105.32], "CN": [35.86, 104.19], "EG": [26.82, 30.80], "DE": [51.16, 10.45]};
function latLonToVector3(lat, lon, radius) {
    const phi = (90 - lat) * Math.PI / 180;
    const theta = (lon + 180) * Math.PI / 180;
    return new THREE.Vector3(-radius * Math.sin(phi) * Math.cos(theta), radius * Math.cos(phi), radius * Math.sin(phi) * Math.sin(theta));
}

let attackCount = 0;
const attackLines = [];
const alertSound = document.getElementById('alertSound');

async function fetchAttacks() {
    const res = await fetch('/api/attacks'); // ← مهم: بقينا بنكلم /api/attacks
    const data = await res.json();
    data.slice(0,2).forEach(ip => {
        const coords = countryCoords[ip.countryCode] || [0,0];
        const end = latLonToVector3(coords[0], coords[1], 1.01);
        const start = latLonToVector3(Math.random()*180-90, Math.random()*360-180, 1.01);
        const mid = start.clone().add(end).multiplyScalar(0.5).normalize().multiplyScalar(1.4);
        const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(new THREE.QuadraticBezierCurve3(start, mid, end).getPoints(50)), new THREE.LineBasicMaterial({ color: 0xff0088, transparent: true }));
        scene.add(line);
        attackLines.push({line, life: 80});
        alertSound.play().catch(e=>{});
        attackCount++;
        document.getElementById('attacks').innerText = attackCount;
        document.getElementById('logList').innerHTML = `<div class="log-item">${ip.ipAddress} → ${ip.countryCode}</div>` + document.getElementById('logList').innerHTML;
    });
}

function animate() {
    requestAnimationFrame(animate);
    globe.rotation.y += 0.001;
    for(let i = attackLines.length - 1; i >= 0; i--) {
        attackLines[i].life--;
        attackLines[i].line.material.opacity = attackLines[i].life / 80;
        if(attackLines[i].life <= 0) scene.remove(attackLines[i].line), attackLines.splice(i, 1);
    }
    controls.update();
    renderer.render(scene, camera);
}
animate();
setInterval(fetchAttacks, 3000);
</script>
</body>
</html>
