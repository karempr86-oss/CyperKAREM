<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cyber Threat Map 2D - Cinematic</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; color: #00ff88; font-family: 'Orbitron', sans-serif; overflow: hidden; }
canvas { display: block; }
.header { position: absolute; top: 0; width: 100%; z-index: 100; background: rgba(0,0,0,0.9); padding: 20px; border-bottom: 2px solid #00ff88; text-align: center; font-size: 26px; font-weight: 900; text-shadow: 0 0 20px #00ff88; }
#cinemaBtn { position:absolute; top:80px; left:50%; transform:translateX(-50%); z-index:100; padding:12px 30px; background:#ff0088; border:none; border-radius:25px; color:#fff; font-family:'Orbitron'; font-weight:700; cursor:pointer; box-shadow:0 0 20px #ff0088; transition:0.3s; }
#cinemaBtn:hover { transform:translateX(-50%) scale(1.05); }
.stats { position: absolute; bottom: 30px; left: 30px; z-index: 100; background: rgba(0,0,0,0.9); border: 1px solid #00ff88; padding: 25px; border-radius: 15px; min-width: 280px; }
.stats h3 { margin-bottom: 15px; color: #00ff88; }
.log { position: absolute; bottom: 30px; right: 30px; z-index: 100; background: rgba(0,0,0,0.9); border: 1px solid #ff0088; padding: 20px; border-radius: 15px; width: 350px; height: 300px; overflow-y: auto; }
.log h3 { color: #ff0088; margin-bottom: 10px; }
.log-item { font-size: 12px; margin: 5px 0; color: #ccc; border-left: 2px solid #ff0088; padding-left: 8px; animation: fadeIn 0.5s; }
@keyframes fadeIn { from {opacity: 0;} to {opacity: 1;} }
</style>
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<div class="header">🌐 LIVE CYBER ATTACK MAP 2D ● VERCEL</div>
<button id="cinemaBtn">🎬 CINEMATIC MODE</button>

<div class="stats">
    <h3>GLOBAL STATISTICS</h3>
    <div>Total Attacks: <span id="attacks">0</span></div>
    <div>Active Threats: <span id="active">0</span></div>
</div>

<div class="log">
    <h3>🚨 LIVE ATTACK LOG</h3>
    <div id="logList"></div>
</div>

<audio id="alertSound" src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3" preload="auto"></audio>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
const camera = new THREE.OrthographicCamera(-2, 2, 1, -1, 0.1, 1000); // كاميرا 2D
camera.position.z = 3;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableRotate = false; // ممنوع اللف
controls.enableZoom = true;

// 1. خريطة العالم المسطحة بدل الكرة
const loader = new THREE.TextureLoader();
const map = new THREE.Mesh(
    new THREE.PlaneGeometry(4, 2), // مستطيل
    new THREE.MeshBasicMaterial({
        map: loader.load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg'),
        transparent: true
    })
);
scene.add(map);

// شبكة دراماتيك
const grid = new THREE.GridHelper(4, 20, 0x00ff88, 0x00ff88);
grid.rotation.x = Math.PI / 2;
grid.material.opacity = 0.2;
grid.material.transparent = true;
scene.add(grid);

scene.add(new THREE.AmbientLight(0x404040));

// احداثيات الدول للخريطة المسطحة
const countryCoords = {
    "US": [-0.8, 0.3], "RU": [0.8, 0.5], "CN": [0.6, 0.2],
    "DE": [0.05, 0.35], "IN": [0.5, 0], "BR": [-0.3, -0.3],
    "EG": [0.15, 0.1], "JP": [1, 0.2], "GB": [-0.1, 0.4],
    "FR": [0, 0.3], "CA": [-1, 0.4], "AU": [0.8, -0.5]
};

function latLonToVector2(country) {
    return countryCoords[country] || [0,0];
}

let attackCount = 0;
const attackLines = [];
const alertSound = document.getElementById('alertSound');
let cinematicMode = false;

document.getElementById('cinemaBtn').onclick = () => {
    cinematicMode =!cinematicMode;
    document.getElementById('cinemaBtn').innerText = cinematicMode? '⚡ NORMAL MODE' : '🎬 CINEMATIC MODE';
    document.getElementById('cinemaBtn').style.background = cinematicMode? '#00ff88' : '#ff0088';
    document.getElementById('cinemaBtn').style.boxShadow = cinematicMode? '0 0 20px #00ff88' : '0 0 20px #ff0088';
}

function createPulse(x, y) {
    const size = cinematicMode? 0.08 : 0.04;
    const life = cinematicMode? 80 : 40;
    const pulse = new THREE.Mesh(new THREE.CircleGeometry(size, 32), new THREE.MeshBasicMaterial({color: 0xff0000, transparent: true}));
    pulse.position.set(x, y, 0.01);
    scene.add(pulse);
    let l = life;
    function anim() {
        l--;
        pulse.scale.multiplyScalar(1.05);
        pulse.material.opacity = l / life;
        if(l > 0) requestAnimationFrame(anim); else scene.remove(pulse);
    }
    anim();
}

function addToLog(ip, country) {
    const logList = document.getElementById('logList');
    const item = document.createElement('div');
    item.className = 'log-item';
    item.innerText = `[${new Date().toLocaleTimeString()}] ${ip} → ${country}`;
    logList.prepend(item);
    if(logList.children.length > 15) logList.removeChild(logList.lastChild);
}

async function fetchAttacks() {
    try {
        const res = await fetch('/api/attacks');
        const data = await res.json();
        if(data.length === 0) return;

        data.slice(0,2).forEach(ip => {
            const [endX, endY] = latLonToVector2(ip.countryCode);
            const startX = Math.random() * 4 - 2;
            const startY = Math.random() * 2 - 1;

            const points = [];
            for(let i = 0; i <= 50; i++) {
                const t = i / 50;
                const x = startX + (endX - startX) * t;
                const y = startY + (endY - startY) * t + Math.sin(t * Math.PI) * 0.3; // قوس
                points.push(new THREE.Vector3(x, y, 0));
            }

            const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), new THREE.LineBasicMaterial({ color: 0xff0088, transparent: true, linewidth: 2 }));
            scene.add(line);
            attackLines.push({line, life: cinematicMode? 150 : 80});

            createPulse(endX, endY);
            alertSound.currentTime = 0; alertSound.play().catch(e=>{});

            attackCount++;
            document.getElementById('attacks').innerText = attackCount;
            document.getElementById('active').innerText = attackLines.length;
            addToLog(ip.ipAddress, ip.countryCode);
        });
    } catch(e) { console.log("Fetch Error", e) }
}

function animate() {
    requestAnimationFrame(animate);
    for(let i = attackLines.length - 1; i >= 0; i--) {
        attackLines[i].life--;
        attackLines[i].line.material.opacity = attackLines[i].life / (cinematicMode? 150 : 80);
        if(attackLines[i].life <= 0) scene.remove(attackLines[i].line), attackLines.splice(i, 1);
    }
    controls.update();
    renderer.render(scene, camera);
}
animate();
setInterval(fetchAttacks, cinematicMode? 5000 : 3000); // ابطأ في السينمائي

window.addEventListener('resize', () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
