<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Threat Map 3D</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    color: #0ff;
    font-family: 'Courier New', monospace;
    overflow: hidden;
  }
  #globe { width: 100%; height: 100vh; }
 .hud {
    position: absolute; top: 20px; left: 20px;
    background: rgba(0,10,20,0.85); padding: 15px; border-radius: 8px;
    border: 1px solid #0ff; z-index: 10; backdrop-filter: blur(5px);
  }
 .hud h2 { font-size: 18px; margin-bottom: 10px; color: #ff0044; }
 .stat { margin: 5px 0; font-size: 14px; }
 .legend {
    position: absolute; bottom: 20px; left: 20px;
    background: rgba(0,10,20,0.85); padding: 10px; border-radius: 8px;
    border: 1px solid #0ff; z-index: 10; font-size: 12px;
  }
 .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; }
 .loading {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    color: #0ff; font-size: 20px; z-index: 10;
  }
</style>
</head>
<body>
<div class="loading" id="loading">Loading 3D Map...</div>
<div class="hud">
  <h2>⚡ LIVE CYBER ATTACKS</h2>
  <div class="stat">Attacks: <span id="attackCount">0</span>/sec</div>
  <div class="stat">Last IP: <span id="lastIP">-</span></div>
  <div class="stat">Status: <span id="status">Live</span></div>
</div>
<div class="legend">
  <div><span class="dot" style="background:#ff0044"></span>Attack Origin</div>
  <div><span class="dot" style="background:#00ff88"></span>Target Server</div>
</div>
<canvas id="globe"></canvas>

<script>
let scene, camera, renderer, globe, controls;
const attackLines = [];
const attackDots = [];

const coords = {
  "US": [37.09, -95.71], "CN": [35.86, 104.19], "RU": [61.52, 105.32],
  "DE": [51.16, 10.45], "GB": [55.37, -3.43], "FR": [46.22, 2.21],
  "BR": [-14.23, -51.92], "IN": [20.59, 78.96], "JP": [36.20, 138.25],
  "KR": [35.90, 127.76], "CA": [56.13, -106.34], "AU": [-25.27, 133.77],
  "EG": [26.82, 30.80], "SA": [23.88, 45.14], "AE": [23.42, 53.84],
  "IL": [31.04, 34.85], "TR": [38.96, 35.24], "IT": [41.87, 12.56]
};

function latLongToVector3(lat, lon, radius) {
  const phi = (90 - lat) * (Math.PI / 180);
  const theta = (lon + 180) * (Math.PI / 180);
  return new THREE.Vector3(
    -radius * Math.sin(phi) * Math.cos(theta),
    radius * Math.cos(phi),
    radius * Math.sin(phi) * Math.sin(theta)
  );
}

function randomIP() {
  return `${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}`;
}

function init() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.z = 200;

  renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('globe'), antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableZoom = true;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.2;
  controls.minDistance = 100;
  controls.maxDistance = 300;

  // اضاءة
  scene.add(new THREE.AmbientLight(0x222222));
  const light = new THREE.DirectionalLight(0xffffff, 1);
  light.position.set(5,3,5);
  scene.add(light);

  // الكره الارضيه بخريطه
  const geometry = new THREE.SphereGeometry(60, 64, 64);
  const textureLoader = new THREE.TextureLoader();
  const earthTexture = textureLoader.load('https://unpkg.com/three-globe@2.24.2/example/img/earth-blue-marble.jpg');
  const bumpMap = textureLoader.load('https://unpkg.com/three-globe@2.24.2/example/img/earth-topology.png');
  const specMap = textureLoader.load('https://unpkg.com/three-globe@2.24.2/example/img/earth-clouds.png');

  const material = new THREE.MeshPhongMaterial({
    map: earthTexture,
    bumpMap: bumpMap,
    bumpScale: 0.5,
    specularMap: specMap,
    specular: new THREE.Color('grey'),
    shininess: 15
  });
  globe = new THREE.Mesh(geometry, material);
  scene.add(globe);

  document.getElementById('loading').style.display = 'none';
  spawnAttack(); // ابدأ اول هجمه
  setInterval(spawnAttack, 800); // هجمه جديده كل 0.8 ثانيه
  animate();
}

function spawnAttack() {
  const countries = Object.keys(coords);
  const from = countries[Math.floor(Math.random()*countries.length)];
  let to = countries[Math.floor(Math.random()*countries.length)];
  while(to === from) to = countries[Math.floor(Math.random()*countries.length)];

  const fromPos = latLongToVector3(coords[from][0], coords[from][1], 61);
  const toPos = latLongToVector3(coords[to][0], coords[to][1], 61);

  // نقطه المصدر
  const dotGeo = new THREE.SphereGeometry(1.2, 8, 8);
  const dotMat = new THREE.MeshBasicMaterial({ color: 0xff0044 });
  const dot = new THREE.Mesh(dotGeo, dotMat);
  dot.position.copy(fromPos);
  scene.add(dot);
  attackDots.push(dot);

  // خط مقوس واقعي
  const mid = fromPos.clone().lerp(toPos, 0.5);
  mid.normalize().multiplyScalar(85); // ارتفاع القوس

  const curve = new THREE.CatmullRomCurve3([fromPos, mid, toPos]);
  const points = curve.getPoints(50);
  const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
  const lineMat = new THREE.LineBasicMaterial({
    color: 0xff0044,
    transparent: true,
    opacity: 0.8
  });
  const line = new THREE.Line(lineGeo, lineMat);
  scene.add(line);
  attackLines.push({line, dot, life: 100});

  // نقطه الهدف
  const targetDot = new THREE.Mesh(dotGeo, new THREE.MeshBasicMaterial({ color: 0x00ff88 }));
  targetDot.position.copy(toPos);
  scene.add(targetDot);
  attackDots.push(targetDot);

  // تحديث ال HUD
  document.getElementById('attackCount').innerText = attackLines.length;
  document.getElementById('lastIP').innerText = randomIP();
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  globe.rotation.y += 0.0005; // لف خفيف

  // امسح الهجمات القديمه
  for(let i = attackLines.length - 1; i >= 0; i--) {
    attackLines[i].life -= 2;
    attackLines[i].line.material.opacity = attackLines[i].life / 100;
    if(attackLines[i].life <= 0) {
      scene.remove(attackLines[i].line);
      scene.remove(attackLines[i].dot);
      attackLines.splice(i, 1);
    }
  }
  // امسح النقط القديمه
  if(attackDots.length > 50) {
    scene.remove(attackDots.shift());
  }

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

init();
</script>
</body>
</html>
