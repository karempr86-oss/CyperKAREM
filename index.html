<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cyber Threat Map REAL</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; color: #00ff88; font-family: 'Orbitron', sans-serif; overflow: hidden; }
canvas { display: block; }
.header { position: absolute; top: 0; width: 100%; z-index: 100; background: linear-gradient(180deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0) 100%); padding: 20px; text-align: center; font-size: 28px; font-weight: 900; text-shadow: 0 0 20px #00ff88, 0 0 40px #00ff88; }
#cinemaBtn { position:absolute; top:80px; left:50%; transform:translateX(-50%); z-index:100; padding:12px 30px; background:#ff0088; border:2px solid #ff0088; border-radius:25px; color:#fff; font-family:'Orbitron'; font-weight:700; cursor:pointer; box-shadow:0 0 30px #ff0088; transition:0.3s; }
.stats { position: absolute; bottom: 30px; left: 30px; z-index: 100; background: rgba(0,0,0,0.85); border: 1px solid #00ff88; padding: 25px; border-radius: 15px; backdrop-filter: blur(10px); }
.log { position: absolute; bottom: 30px; right: 30px; z-index: 100; background: rgba(0,0,0,0.85); border: 1px solid #ff0088; padding: 20px; border-radius: 15px; width: 380px; height: 320px; overflow-y: auto; backdrop-filter: blur(10px); }
.log-item { font-size: 11px; margin: 6px 0; color: #0f0; border-left: 2px solid #ff0088; padding-left: 8px; animation: slideIn 0.3s; }
@keyframes slideIn { from {transform: translateX(20px); opacity:0;} to {transform: translateX(0); opacity:1;} }
</style>
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<div class="header">🌐 LIVE REAL CYBER ATTACKS ● ABUSEIPDB</div>
<button id="cinemaBtn">🎬 CINEMATIC MODE</button>
<div class="stats"><h3>STATS</h3><div>Total: <span id="attacks">0</span></div><div>Active: <span id="active">0</span></div></div>
<div class="log"><h3>🚨 LIVE FEED</h3><div id="logList"></div></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000);
scene.fog = new THREE.Fog(0x000, 2, 6);
const camera = new THREE.OrthographicCamera(-2.5, 2.5, 1.25, -1.25, 0.1, 1000);
camera.position.z = 3;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);
new OrbitControls(camera, renderer.domElement);

// 1. خريطة بدقة اعلى
const loader = new THREE.TextureLoader();
const map = new THREE.Mesh(
    new THREE.PlaneGeometry(5, 2.5),
    new THREE.MeshBasicMaterial({ map: loader.load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg') })
);
scene.add(map);

// 2. احداثيات اكتر وادق
const countryCoords = {
    "US": [-0.95, 0.3], "RU": [0.9, 0.6], "CN": [0.7, 0.15], "DE": [0.05, 0.4],
    "IN": [0.55, -0.05], "BR": [-0.4, -0.4], "EG": [0.18, 0.05], "JP": [1.1, 0.18],
    "GB": [-0.12, 0.42], "FR": [0, 0.32], "CA": [-1.1, 0.45], "AU": [0.9, -0.6],
    "KR": [1, 0.25], "IR": [0.4, 0.1], "KP": [0.85, 0.3], "NL": [0, 0.38]
};

let attackCount = 0;
const attackLines = [];
let cinematicMode = false;
document.getElementById('cinemaBtn').onclick = () => {
    cinematicMode =!cinematicMode;
    document.getElementById('cinemaBtn').innerText = cinematicMode? '⚡ NORMAL MODE' : '🎬 CINEMATIC MODE';
    document.getElementById('cinemaBtn').style.background = cinematicMode? '#00ff88' : '#ff0088';
}

// 3. دالة ترسم خط "نار" واقعي ب 3 طبقات
function createRealisticLine(start, end) {
    const group = new THREE.Group();
    const points = [];
    for(let i = 0; i <= 100; i++) { // نقاط اكتر = انحناء انعم
        const t = i / 100;
        const x = start.x + (end.x - start.x) * t;
        const y = start.y + (end.y - start.y) * t + Math.sin(t * Math.PI) * 0.5; // قوس اعلى
        const z = Math.sin(t * Math.PI) * 0.2; // ارتفاع 3D
        points.push(new THREE.Vector3(x, y, z));
    }

    // طبقة 1: قلب الخط احمر
    const core = new THREE.Line(new THREE.BufferGeometry().setFromPoints(points),
        new THREE.LineBasicMaterial({ color: 0xff0000, linewidth: 3 }));
    // طبقة 2: توهج برتقاني
    const glow = new THREE.Line(new THREE.BufferGeometry().setFromPoints(points),
        new THREE.LineBasicMaterial({ color: 0xff6600, transparent: true, opacity: 0.6 }));
    // طبقة 3: هالة وردي
    const aura = new THREE.Line(new THREE.BufferGeometry().setFromPoints(points),
        new THREE.LineBasicMaterial({ color: 0xff0088, transparent: true, opacity: 0.3 }));

    group.add(core, glow, aura);
    return group;
}

// 4. انفجار واقعي
function createExplosion(pos) {
    for(let i=0; i<5; i++){ // 5 جزيئات
        const p = new THREE.Mesh(new THREE.SphereGeometry(0.01, 8, 8), new THREE.MeshBasicMaterial({color: 0xff3300}));
        p.position.copy(pos);
        p.velocity = new THREE.Vector3(Math.random()-0.5, Math.random()-0.5, 0).multiplyScalar(0.05);
        scene.add(p);
        let life = 30;
        function anim(){
            life--;
            p.position.add(p.velocity);
            p.material.opacity = life/30;
            if(life>0) requestAnimationFrame(anim); else scene.remove(p);
        }
        anim();
    }
}

async function fetchAttacks() {
    try {
        const res = await fetch('/api/attacks');
        let data = await res.json();
        if(!data || data.length === 0) return; // لو فاضي خلاص

        data.slice(0,3).forEach(ip => { // 3 هجمات كل مرة
            const [endX, endY] = countryCoords[ip.countryCode] || [0,0];
            const startX = Math.random() * 5 - 2.5;
            const startY = Math.random() * 2.5 - 1.25;

            const line = createRealisticLine(new THREE.Vector3(startX, startY, 0), new THREE.Vector3(endX, endY, 0));
            scene.add(line);
            attackLines.push({group: line, life: cinematicMode? 250 : 120, endPos: new THREE.Vector3(endX, endY, 0)});

            createExplosion(new THREE.Vector3(endX, endY, 0));
            attackCount++;
            document.getElementById('attacks').innerText = attackCount;
            document.getElementById('active').innerText = attackLines.length;
            document.getElementById('logList').innerHTML = `<div class="log-item">[${new Date().toLocaleTimeString()}] ${ip.ipAddress} → ${ip.countryCode}</div>` + document.getElementById('logList').innerHTML;
        });
    } catch(e) { console.log("API Error", e) }
}

function animate() {
    requestAnimationFrame(animate);
    for(let i = attackLines.length - 1; i >= 0; i--) {
        attackLines[i].life--;
        const opacity = attackLines[i].life / (cinematicMode? 250 : 120);
        attackLines[i].group.children.forEach(child => child.material.opacity = opacity);
        if(attackLines[i].life <= 5) createExplosion(attackLines[i].endPos); // انفجار عند النهاية
        if(attackLines[i].life <= 0) {
            scene.remove(attackLines[i].group);
            attackLines.splice(i, 1);
        }
    }
    renderer.render(scene, camera);
}
animate();
setInterval(fetchAttacks, 1500); // هجوم كل 1.5 ثانية

window.addEventListener('resize', () => renderer.setSize(window.innerWidth, window.innerHeight));
</script>
</body>
</html>
